<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200"><rect width="300" height="200" fill="#171C2B"/><text x="150" y="115" font-family="Georgia,serif" font-size="72" fill="#F4F1E8" text-anchor="middle">S</text></svg></template>

<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #FAF8F3; }
  a { color: oklch(46% 0.13 265); text-decoration: none; }
  a:hover { color: oklch(40% 0.14 265); text-decoration: underline; }
</style>
</helmet>

<div style="font-family: 'Inter', sans-serif; color: #211F1C; background: #FAF8F3; min-height: 100vh;">
  <header style="position: sticky; top: 0; z-index: 50; background: rgba(250,248,243,0.92); backdrop-filter: blur(8px); border-bottom: 1px solid #E7E2D8;">
    <div style="max-width: 1180px; margin: 0 auto; padding: 16px 32px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;">
      <a href="index.html" style="display: flex; align-items: center; gap: 12px; color: #211F1C;">
        <img src="assets/Logo.png" alt="StARLinG Lab logo" style="height: 34px; width: auto; display: block;" />
        <span style="font-family: 'Newsreader', serif; font-size: 19px; font-weight: 600;">StARLinG Lab</span>
      </a>
      <nav style="display: flex; gap: 28px; flex-wrap: wrap; font-size: 15px; font-weight: 500;">
        <a href="People.html" style="color: #4A4640;">People</a>
        <a href="Publications.html" style="color: #4A4640;">Publications</a>
        <a href="Projects.html" style="color: #4A4640;">Projects</a>
        <a href="Software.html" style="color: #4A4640;">Software</a>
        <a href="Datasets.html" style="color: #4A4640;">Datasets</a>
        <a href="Gallery.html" style="color: #4A4640;">Gallery</a>
      </nav>
    </div>
  </header>

  <section style="max-width: 820px; margin: 0 auto; padding: 72px 32px 24px;">
    <p style="font-size: 13px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: oklch(58% 0.12 45); margin: 0 0 14px;">Lab updates</p>
    <h1 style="font-family: 'Newsreader', serif; font-size: 44px; font-weight: 500; margin: 0 0 40px;">News Archive</h1>

    <sc-for list="{{ items }}" as="n" hint-placeholder-count="10">
      <div id="{{ n.id }}" style="padding: 26px 0; border-bottom: 1px solid #E7E2D8; scroll-margin-top: 90px;">
        <p style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: oklch(58% 0.12 45); margin: 0 0 8px;">{{ n.date }}</p>
        <h2 style="font-family: 'Newsreader', serif; font-size: 20px; font-weight: 600; line-height: 1.35; margin: 0 0 10px;">{{ n.title }}</h2>
        <p style="font-size: 14.5px; line-height: 1.65; color: #4A4640; margin: 0 0 8px;">{{ n.body }}</p>
        <sc-if value="{{ n.linkUrl }}">
          <a href="{{ n.linkUrl }}" style="font-size: 13.5px; font-weight: 600;">{{ n.linkLabel }} &rarr;</a>
        </sc-if>
      </div>
    </sc-for>
  </section>

  <footer style="background: #211F1C; color: #C9C2B2; margin-top: 40px;">
    <div style="max-width: 1180px; margin: 0 auto; padding: 40px 32px; text-align: center;">
      <p style="font-size: 13px; margin: 0;">&copy; 2026 StARLinG Lab &middot; The University of Texas at Dallas</p>
    </div>
  </footer>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const items = [
      { id: "presidential-fellow", date: "20 Jun 2026", title: "Prof. Sriraam Natarajan Appointed Presidential Distinguished Fellow for Artificial Intelligence at UT Dallas!",
        body: "Prof. Sriraam Natarajan has been appointed as the Presidential Distinguished Fellow for Artificial Intelligence at The University of Texas at Dallas, recognizing his leadership and contributions to AI research and global collaboration.", linkUrl: null },
      { id: "athresh-dissertation", date: "07 Apr 2026", title: "Congratulations to Dr. Karanam for successfully defending his thesis!",
        body: "Athresh successfully defended his PhD dissertation, \u201cEffective, Efficient, and Explainable Learning in Data-Scarce and Noisy Domains,\u201d becoming the 14th PhD student to graduate from StARLinG Lab.", linkUrl: null },
      { id: "nbcdfw-2026", date: "12 Feb 2026", title: "Prof. Natarajan Featured on NBC DFW Live: 'Romance in the Age of AI'",
        body: "Prof. Natarajan appeared on NBC DFW to discuss how artificial intelligence is influencing modern relationships and shared his views on digital companionship.", linkUrl: "https://magazine.utdallas.edu/2026/02/11/timely-topic-romance-in-the-age-of-ai/", linkLabel: "Read the full interview" },
      { id: "acs-2025", date: "16 Sep 2025", title: "Our paper titled \u201cHuman-Allied Relational Reinforcement Learning\u201d has been accepted to ACS 2025",
        body: "This paper introduces a novel framework that combines Relational Reinforcement Learning with object-centric representation to handle both structured and unstructured data, actively querying the human expert for guidance.", linkUrl: "http://www.cogsys.org/proceedings/2025/paper-2025-9.pdf", linkLabel: "Read the paper" },
      { id: "saurabh-dissertation", date: "14 Jul 2025", title: "Congratulations to Dr. Mathur for successfully defending his thesis!",
        body: "Dr. Saurabh Sanjay Mathur defended his PhD dissertation on \u201cAI-in-the-loop for Effective Healthcare,\u201d becoming the 13th student to graduate from StARLinG Lab.", linkUrl: null },
      { id: "aistats-2025", date: "22 Jan 2025", title: "Our paper titled \u201cCredibility-Aware Multi-Modal Fusion Using Probabilistic Circuits\u201d has been accepted to AISTATS 2025",
        body: "This paper explores credibility in noisy, multi-source domains, proposing a combination function using probabilistic circuits to combine predictive distributions and evaluate the credibility of each modality.", linkUrl: "https://arxiv.org/abs/2403.03281", linkLabel: "Read on arXiv" },
      { id: "aaai-councilor-2025", date: "28 Jan 2025", title: "Prof. Natarajan elected as Councilor of AAAI!",
        body: "Prof. Natarajan was elected as Councilor of the Association for the Advancement of Artificial Intelligence, the volunteer leadership body of AAAI.", linkUrl: null },
      { id: "aaai-fellowship-2025", date: "16 Jan 2025", title: "Prof. Natarajan elected as a Fellow of AAAI!",
        body: "Prof. Natarajan was recognized for his significant contributions to Statistical Relational AI, healthcare applications, and his dedicated service to the AAAI community.", linkUrl: null },
      { id: "aamas-2025", date: "19 Dec 2024", title: "Our paper on Combining Planning and Reinforcement Learning for Relational Multiagent Domains accepted to AAMAS 2025",
        body: "This work introduces MaRePReL, a framework integrating hierarchical relational planning with reinforcement learning to address dimensionality, non-stationarity, and credit assignment in multiagent RL.", linkUrl: null },
      { id: "aaai-2025-hapc", date: "09 Dec 2024", title: "Our paper on A Unified Framework for Human-Allied Learning of Probabilistic Circuits accepted to AAAI 2025",
        body: "This work proposes a unified framework that systematically integrates diverse domain knowledge into probabilistic circuit parameter learning \u2014 particularly useful in data-scarce, knowledge-rich domains like healthcare.", linkUrl: "https://arxiv.org/abs/2405.02413", linkLabel: "Read on arXiv" },
      { id: "aaai-bluesky-2025", date: "21 Nov 2024", title: "Our blue sky paper on Human-in-the-loop or AI-in-the-loop? accepted to AAAI 2025",
        body: "This paper argues existing HIL evaluation methods overemphasize the machine's role, proposing an AI2L perspective that recognizes the human expert as an active, influential participant in the system.", linkUrl: "https://starling-lab.github.io/assets/pdfs/Human_in_the_loop_or_AI_in_the_loop.pdf", linkLabel: "Read the paper" },
      { id: "tulane-lecture", date: "07 Nov 2024", title: "Professor Natarajan's distinguished lecture at Tulane University",
        body: "Prof. Natarajan gave a distinguished lecture on \u201cEnhancing healthcare with AI-in-the-loop,\u201d presenting progress on human-guided learning across electronic health records, clinical studies, and surveys.", linkUrl: null },
      { id: "fusion-2024", date: "01 May 2024", title: "Our paper on Robustness and Reliability of Late Multi-Modal Fusion accepted to FUSION 2024",
        body: "This work investigates the robustness of probabilistic circuits as fusion functions under missing and noisy data, examining impacts on calibration and reliability of resulting classifiers.", linkUrl: "https://starling-lab.github.io/assets/pdfs/Fusion2024.pdf", linkLabel: "Read the paper" },
      { id: "uai-2024", date: "26 Apr 2024", title: "Our paper on Knowledge Intensive Learning of Credal Networks accepted to UAI 2024",
        body: "This work tackles parameter learning when data is sparse, incomplete, and uncertain using credal networks that incorporate qualitative monotonic influence statements.", linkUrl: "https://starling-lab.github.io/assets/pdfs/Credal_Networks.pdf", linkLabel: "Read the paper" },
      { id: "teaching-award-2024", date: "26 Apr 2024", title: "Prof. Natarajan honored with President\u2019s Teaching Excellence Award!",
        body: "Recognizing 15 years of teaching, more than 20 courses taught, and at least six original courses developed by Prof. Natarajan.", linkUrl: null },
      { id: "ijcai-2024", date: "19 Apr 2024", title: "Our survey on Building Expressive and Tractable Probabilistic Generative Models accepted to IJCAI 2024",
        body: "A comprehensive survey of advancements in tractable probabilistic generative modeling, primarily focusing on Probabilistic Circuits (PCs), led by Sahil.", linkUrl: "https://arxiv.org/pdf/2402.00759.pdf", linkLabel: "Read on arXiv" },
      { id: "aime-2024", date: "16 Apr 2024", title: "Our paper on Modeling Multiple Adverse Pregnancy Outcomes accepted to AIME 2024",
        body: "This work models adverse pregnancy outcomes from diverse data sources, studying what is common between them and what is unique to each.", linkUrl: "https://starling-lab.github.io/assets/pdfs/Modeling_multiple_APOs.pdf", linkLabel: "Read the paper" },
      { id: "siwen-dissertation", date: "22 Jan 2024", title: "Congratulations to Dr. Yan on successfully defending his thesis!",
        body: "Dr. Siwen Yan defended his dissertation, \u201cEffective Human Allied Learning of Tree Ensembles.\u201d", linkUrl: null },
      { id: "hessian-ai-fellow", date: "20 Jul 2023", title: "Prof. Sriraam Natarajan selected as Hessian.ai Fellow!",
        body: "During a visit to TU Darmstadt, Prof. Natarajan was felicitated as a Hessian.ai Fellow following his talk on Neurosymbolic Learning via the integration of relational planning and deep RL.", linkUrl: null },
      { id: "uai-2023", date: "08 May 2023", title: "Two papers accepted to UAI 2023!",
        body: "Congratulations to Sahil, Saurabh, and collaborators Kristian Kersting and Vibhav Gogate on \u201cProbabilistic Flow Circuits\u201d and \u201cKnowledge Intensive Learning of Cutset Networks.\u201d", linkUrl: "https://starling-lab.github.io/assets/pdfs/sidheekh_uai_23.pdf", linkLabel: "Read the papers" },
      { id: "harsha-dissertation", date: "25 Feb 2023", title: "Congratulations to Dr. Kokel for successfully defending her thesis",
        body: "Dr. Harsha Kokel defended her dissertation, \u201cBeyond Data: Efficient Knowledge-Guided Learning for Sparse and Structured Domains.\u201d", linkUrl: null }
    ];
    return { items };
  }
}

</script>
</body>
</html>
