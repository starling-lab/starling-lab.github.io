<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200"><rect width="300" height="200" fill="#171C2B"/><text x="150" y="115" font-family="Georgia,serif" font-size="72" fill="#F4F1E8" text-anchor="middle">S</text></svg></template>

<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #FAF8F3; }
  a { color: oklch(46% 0.13 265); text-decoration: none; }
  a:hover { color: oklch(40% 0.14 265); text-decoration: underline; }
</style>
</helmet>

<div style="font-family: 'Inter', sans-serif; color: #211F1C; background: #FAF8F3; min-height: 100vh;">
  <header style="position: sticky; top: 0; z-index: 50; background: rgba(250,248,243,0.92); backdrop-filter: blur(8px); border-bottom: 1px solid #E7E2D8;">
    <div style="max-width: 1180px; margin: 0 auto; padding: 16px 32px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;">
      <a href="index.html" style="display: flex; align-items: center; gap: 12px; color: #211F1C;">
        <img src="assets/Logo.png" alt="StARLinG Lab logo" style="height: 34px; width: auto; display: block;" />
        <!-- <span style="font-family: 'Newsreader', serif; font-size: 19px; font-weight: 600;">StARLinG Lab</span> -->
      </a>
      <nav style="display: flex; gap: 28px; flex-wrap: wrap; font-size: 15px; font-weight: 500;">
        <a href="People.html" style="color: #4A4640;">People</a>
        <a href="Publications.html" style="color: oklch(46% 0.13 265);">Publications</a>
        <a href="Projects.html" style="color: #4A4640;">Projects</a>
        <a href="Software.html" style="color: #4A4640;">Software</a>
        <a href="Datasets.html" style="color: #4A4640;">Datasets</a>
        <a href="Gallery.html" style="color: #4A4640;">Gallery</a>
      </nav>
    </div>
  </header>

  <section style="max-width: 900px; margin: 0 auto; padding: 72px 32px 24px;">
    <!-- <p style="font-size: 13px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: oklch(58% 0.12 45); margin: 0 0 14px;">Peer-reviewed research</p> -->
    <h1 style="font-family: 'Newsreader', serif; font-size: 44px; font-weight: 500; margin: 0 0 28px;">Publications</h1>

    <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 40px;">
      <sc-for list="{{ filterOptions }}" as="f" hint-placeholder-count="5">
        <button onClick="{{ f.onClick }}" style="{{ f.style }}">{{ f.label }}</button>
      </sc-for>
    </div>

    <sc-for list="{{ groups }}" as="grp" hint-placeholder-count="10">
      <div style="margin-bottom: 40px;">
        <h2 style="font-family: 'Newsreader', serif; font-size: 22px; font-weight: 600; margin: 0 0 16px; padding-bottom: 10px; border-bottom: 1px solid #E7E2D8; color: oklch(46% 0.13 265);">{{ grp.year }}</h2>
        <div style="display: flex; flex-direction: column; gap: 18px;">
          <sc-for list="{{ grp.items }}" as="pub" hint-placeholder-count="3">
            <div>
              <p style="font-size: 15.5px; font-weight: 600; line-height: 1.4; margin: 0 0 4px;">
                <a href="{{ pub.url }}">{{ pub.title }}</a>
              </p>
              <p style="font-size: 13px; color: #57534A; line-height: 1.5; margin: 0 0 2px;">{{ pub.authorLine }}</p>
              <p style="font-size: 12.5px; color: #8A8477; font-style: italic; margin: 0;">{{ pub.venue }}</p>
              <div style="display: flex; gap: 12px; flex-wrap: wrap; margin-top: 4px;">
                <sc-for list="{{ pub.links }}" as="l" hint-placeholder-count="1">
                  <a href="{{ l.url }}" style="font-size: 12px; font-weight: 600;">{{ l.label }}</a>
                </sc-for>
              </div>
            </div>
          </sc-for>
        </div>
      </div>
    </sc-for>
  </section>

  <footer style="background: #211F1C; color: #C9C2B2;">
    <div style="max-width: 1180px; margin: 0 auto; padding: 40px 32px; text-align: center;">
      <p style="font-size: 13px; margin: 0;">&copy; 2026 StARLinG Lab &middot; The University of Texas at Dallas</p>
    </div>
  </footer>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { publications: [], filter: "all" };

  async componentDidMount() {
    const mod = await import('./data/publications-data.js');
    this.setState({ publications: mod.publications });
  }

  renderVals() {
    const typeLabels = {
      "journal-papers": "Journal",
      "conference-papers": "Conference",
      "workshop-papers": "Workshop",
      "preprints": "Preprint"
    };
  let pubs = this.state.publications.filter(p => p.url).map(p => ({
    ...p,
    authorLine: p.authors.join(', '),
    url: p.url,
    venue: p.venue || "Preprint",
    typeLabel: typeLabels[p.type] || p.type
  }));
    if (this.state.filter !== "all") pubs = pubs.filter(p => p.type === this.state.filter);
    const years = [...new Set(pubs.map(p => p.year))].sort((a, b) => b - a);
    const pinnedTitle = "Safe Offline Policy Improvement for Pediatric ECMO from Limited Clinical Data";
    const groups = years.map(y => {
      const items = pubs.filter(p => p.year === y);
      items.sort((a, b) => (a.title === pinnedTitle ? -1 : b.title === pinnedTitle ? 1 : 0));
      return { year: y, items };
    });
    const filterOptions = [
      { key: "all", label: "All" },
      { key: "journal-papers", label: "Journal" },
      { key: "conference-papers", label: "Conference" },
      { key: "workshop-papers", label: "Workshop" },
      { key: "preprints", label: "Preprint" }
    ].map(f => {
      const active = f.key === this.state.filter;
      return {
        ...f,
        active,
        onClick: () => this.setState({ filter: f.key }),
        style: {
          padding: "8px 18px", borderRadius: 999, fontSize: 13, fontWeight: 600, cursor: "pointer",
          border: active ? "1px solid #211F1C" : "1px solid #D8D2C4",
          background: active ? "#211F1C" : "#FFFFFF",
          color: active ? "#FAF8F3" : "#4A4640"
        }
      };
    });
    return { groups, filterOptions };
  }
}

</script>
</body>
</html>
